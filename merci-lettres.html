<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ORA — Inscription confirmée</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Palanquin:wght@300;400;500;600&family=Tangerine:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#FAF9F6;--ink:#000;--green:#003C1F;--light:#DFF8C1}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:'Palanquin',sans-serif;padding:34px 22px 48px;display:flex;align-items:center;justify-content:center}
.main{width:100%;max-width:500px;margin:0 auto;text-align:center}
.bird{display:block;width:124px;height:auto;margin:0 auto 25px}
.rule{display:block;width:230px;max-width:62%;height:auto;margin:22px auto 23px}
.script{font-family:'Tangerine',cursive;font-size:2.2rem;line-height:1.35;color:var(--ink);max-width:420px;margin:0 auto}
.sig-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:34px auto 0}
.sig{font-family:'Tangerine',cursive;font-size:2.3rem;line-height:1;color:var(--ink);text-align:center}
.sig-bird{width:46px;height:auto;display:block;flex:0 0 auto}
@media(max-width:600px){
 .bird{width:108px;margin-bottom:21px}
 .rule{width:190px;margin:19px auto 19px}
 .script{font-size:1.9rem}
 .sig{font-size:2.05rem}
 .sig-bird{width:40px}
}
</style>
</head>
<body>
<main class="main">
  <img class="bird" src="colibri-hd.png" alt="Colibri ORA"/>
  <img class="rule" src="trait-mini-livre-sans-fond.png" alt="" aria-hidden="true"/>
  <p class="script">Merci, tu es maintenant inscrite à la newsletter ORA.<br/>Tu recevras prochainement de nos nouvelles.</p>
  <div class="sig-wrap">
    <p class="sig">Le voyage vers soi est une aventure.</p>
    <img class="sig-bird" src="colibri.png" alt="" aria-hidden="true"/>
  </div>
</main>
</body>
</html>
